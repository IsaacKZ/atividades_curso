<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cálculo de IMC</title>
</head>
<body>
  <h1>Cálculo de IMC</h1>

  <form>
    <div>
      <label for="inPeso">Peso (kg):</label>
      <input type="number" id="inPeso" step="0.1" placeholder="Ex: 70.5" required>
    </div>
    <div>
      <label for="inAltura">Altura (m):</label>
      <input type="number" id="inAltura" step="0.01" placeholder="Ex: 1.75" required>
    </div>
    <div>
      <input type="submit" value="Calcular IMC">
    </div>
  </form>

  <h3></h3>

  <script>
    let formulario = document.querySelector("form");

    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();

      let peso = Number(document.querySelector("#inPeso").value);
      let altura = Number(document.querySelector("#inAltura").value);

      let imc = peso / (altura * altura);

      let classificacao;

      if (imc < 18.5) {
        classificacao = "Abaixo do peso";
      } else if (imc <= 24.9) {
        classificacao = "Peso normal";
      } else if (imc <= 29.9) {
        classificacao = "Sobrepeso";
      } else if (imc <= 34.9) {
        classificacao = "Obesidade grau I";
      } else if (imc <= 39.9) {
        classificacao = "Obesidade grau II";
      } else {
        classificacao = "Obesidade grau III";
      }

      let resultado = document.querySelector("h3");
      resultado.innerHTML = "IMC: " + imc.toFixed(2) + "<br>Classificação: " + classificacao;
    });
  </script>

</body>
</html>
