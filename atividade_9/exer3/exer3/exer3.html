<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Temperatura</title>
</head>
<body>

  <h1>Conversor de Temperatura</h1>

  <form>
    <div>
      <label for="inTemp">Temperatura:</label>
      <input type="number" id="inTemp" step="0.1" placeholder="Ex: 25" required>
    </div>
    <div>
      <label for="inTipo">Tipo de conversão:</label>
      <select id="inTipo" required>
        <option value="">Selecione</option>
        <option value="cToF">Celsius → Fahrenheit</option>
        <option value="fToC">Fahrenheit → Celsius</option>
      </select>
    </div>
    <div>
      <input type="submit" value="Converter">
    </div>
  </form>

  <h3></h3>

  <script>
    let formulario = document.querySelector("form");

    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();

      let temp = Number(document.querySelector("#inTemp").value);
      let tipo = document.querySelector("#inTipo").value;
      let resultado = document.querySelector("h3");
      let resposta;

      if (tipo === "cToF") {
        resposta = (temp * 9/5) + 32;
        resultado.innerHTML = "Resultado: " + resposta.toFixed(2) + "°F";
      } else if (tipo === "fToC") {
        resposta = (temp - 32) * 5/9;
        resultado.innerHTML = "Resultado: " + resposta.toFixed(2) + "°C";
      }
    });
  </script>

</body>
</html>
