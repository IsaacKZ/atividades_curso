<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concatenação</title>
</head>
<body>
    <Script>
        <h1> Concatenação seria o equivalente do printf do python </h1>
        let nome = prompt("informe o nome ")
        let idade = prompt("informe a idade")
        document.write('<h1> Olá ' + nome + ' tudo bem? Estou vendo aqui que voce possui ' + idade + ' anos </h1>')
    </Script>
</body>
</html>
