<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>casting</title>
</head>
<body>
    <H1> Casting é basicamente a conversão de valores. ex: string para int </H1>
    <script>
        let variavel1 = "10"
        let variavel2 = "20"
        let variavel3 = 10.20
        console.log("Exibindo variáveis do tipo string")
        console.log("Variavel 1: " + variavel1)
        console.log("Variavel 2: " + variavel2)
        console.log("Variavel 3: " + variavel3)

        // Fazendo a conversão
        let variavel10 = parseInt(variavel1)
        let variavel20 = parseInt(variavel2)
        let variavel30 = parseFloat(variavel3)
        console.log("Valores convertidos:")
        console.log("Variavel 10: " + variavel10)
        console.log("Variavel 20: " + variavel20)
        console.log("Variavel 30: " + variavel30)
</script>
</body>
</html>
