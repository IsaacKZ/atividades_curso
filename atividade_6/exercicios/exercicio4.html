<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem até 100</title>
</head>
<body>
    <h1> Contagem e soma até 100</h1>
    <script>
        let soma = 0;
            for (let x = 1; x <= 100; x++) {
            document.write(x + "<br>");
            soma += x;
            }
        document.write("<br>A soma de 1 a 100 é: " + soma);
    </script>
</body>
</html>
