<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz quadrada números</title>
</head>
<body>
    <h1> Raiz quadrada dos 10 números escolhidos</h1>
    <script>
        for (let x = 1; x <= 15; x++) {
            let numero = parseInt(prompt("Informe um número"))
            document.write(x + " - A raiz quadrada de " + numero + " é: " +(Math.sqrt(numero)) + "<br>")
        }
    </script>
</body>
</html>
