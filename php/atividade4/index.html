<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Estilizado</title>
    <link rel="stylesheet" href="css/style.css">
   
</head>
<body>
    <div class="container">
        <h2>Cadastro de Informações Pessoais</h2>
        <form action="cadastro.php" method="POST">
            <label for="nome">Nome:</label>
            <input type="text" id="nm_nome" name="nm_usuario" required>

            <label for="loginn">login:</label>
            <input type="text" id="nm_loginn" name="nm_loginn" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="ds_email" required>

            <label for="password">Telefone:</label>
            <input type="senha" id="senha" name="senha" required>

            <button type="submit">Confirmar</button>
        </form>
    </div>
</body>
