<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Classificação de produtos</title>
</head>
<body>
    <h1> Classificação dos produtos abaixo!</h1>
    <script>
        let escolha = parseInt(prompt("Escolha o código do produto"))

        switch(escolha) {
            case 1:
                document.write("Alimento não perecível!")
                break
            case 2:
                document.write("Alimento perecível!")
                break 
            case 3: 
                document.write("Vestuário!")
                break
            case 4: 
                document.write("Higiene pessoal!")
                break
            case 5: 
                document.write("Limpeza e utensílios domésticos!")
                break
            case 6:
                document.write("Eletrônicos!")
                break 
            case 7:
                document.write("Informática!")
            default:
                document.write("Inválido! Tente códigos entre 1 e 7!")
        }
    </script>
</body>
</html>
