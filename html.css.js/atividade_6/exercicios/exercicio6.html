<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metade números</title>
</head>
<body>
    <h1> Metade dos 10 números escolhidos</h1>
    <script>
        for (let x = 1; x <=10; x++) {
            let numero = parseInt(prompt("Informe um número"))
            document.write(x + " - A metade do número " + numero + " é: " +(numero / 2) + "<br>")
        }
    </script>
</body>
</html>
