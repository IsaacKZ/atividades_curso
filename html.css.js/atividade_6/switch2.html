<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch 2</title>
</head>
<body>
    <h1> Mais exemplos usando SWITCH </h1>
    <script>

        let farol = 'amarelo'
        switch(farol) {
            case 'vermelho':
                alert('Pare! Farol vermelho!')
                break
            case 'amarelo': 
                alert('Atenção')
                break
            case 'verde': 
                alert('Prossiga!')
                break
            default: 
                alert('Inválido')
        }
    </script>
</body>
</html>
