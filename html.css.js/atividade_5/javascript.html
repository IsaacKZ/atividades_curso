<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variáveis</title>
</head>
<body>
    <h1> Exemplo com uso de Variáveis</h1>

    <script>
        let texto = "Linguagem JavaScript" // string
        let numeroInteiro = 10 // inteiro
        let numeroFracionado = 10.50 // float
        let valor = false // boolean
        let teste = null // nulo
        let teste2 // indefinido
        console.log(texto, numeroInteiro, numeroFracionado, valor, teste, teste2)
    </script>
</body>
</html>
