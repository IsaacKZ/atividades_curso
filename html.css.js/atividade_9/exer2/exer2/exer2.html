<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
</head>
<body>

  <h1>Calculadora Básica</h1>

  <form>
    <div>
      <label for="inNum1">Primeiro número:</label>
      <input type="number" id="inNum1" required>
    </div>
    <div>
      <label for="inNum2">Segundo número:</label>
      <input type="number" id="inNum2" required>
    </div>
    <div>
      <label for="inOperacao">Operação:</label>
      <select id="inOperacao" required>
        <option value="">Selecione</option>
        <option value="soma">Adição (+)</option>
        <option value="sub">Subtração (-)</option>
        <option value="mult">Multiplicação (×)</option>
        <option value="div">Divisão (÷)</option>
      </select>
    </div>
    <div>
      <input type="submit" value="Calcular">
    </div>
  </form>

  <h3></h3>

  <script>
    let formulario = document.querySelector("form");

    formulario.addEventListener("submit", function(evento) {
      evento.preventDefault();

      let num1 = Number(document.querySelector("#inNum1").value);
      let num2 = Number(document.querySelector("#inNum2").value);
      let operacao = document.querySelector("#inOperacao").value;
      let resultado = document.querySelector("h3");
      let resposta;

      switch (operacao) {
        case "soma":
          resposta = num1 + num2;
          break;
        case "sub":
          resposta = num1 - num2;
          break;
        case "mult":
          resposta = num1 * num2;
          break;
        case "div":
          if (num2 === 0) {
            resultado.innerHTML = "Erro: não é possível dividir por zero";
            return;
          }
          resposta = num1 / num2;
          break;
      }

      resultado.innerHTML = "Resultado: " + resposta;
    });
  </script>

</body>
</html>
