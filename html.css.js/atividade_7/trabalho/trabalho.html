<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <title>Eventos JavaScript</title>
</head>
<body>
    <h1> Eventos Do JavaScript </h1>
    <hr>
    <div class="container">

        <div class="mouse">
            <h3>Evento onClick</h3>
            <div class="onclick">
                <button id="botao1">Clique aqui</button>
            </div>
            
            <h3>Evento onDblClick</h3>
            <div class="doubleclick"> 
                <button id="botao01">Clique duas vezes aqui</button>
            </div>
        </div>

        <div class="tecla">
            <h3>Evento onKeyPress</h3>
            <input type="text" id="keypress" placeholder="Digite algo...">

            <h3>Evento onKeyDown</h3>
            <input type="text" id="keydown" placeholder="Digite algo...">

            <h3>Evento onKeyUp</h3>
            <input type="text" id="keyup" placeholder="Digite algo...">
        </div>

        <div class="caixa">
            <h3>Evento onBlur</h3>
            <input type="text" id="blur" placeholder="Clique aqui e depois saia...">

            <h3>Evento onFocus</h3>
            <input type="text" id="focus" placeholder="Clique aqui...">
        </div>

    </div>

    <script src="assets/trabalho.js"></script>
</body>
</html>
